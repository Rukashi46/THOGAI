<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>THOGAI — Know your money.</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var validThemes = ['midnight', 'cream', 'cyan', 'liquid', 'navy'];
        // Prefer pinned default theme (device-only key) so it survives re-login
        var pinned = localStorage.getItem('thogai.defaultTheme');
        var t = pinned && validThemes.includes(pinned) ? pinned : null;
        if (!t) {
          var r = localStorage.getItem('thogai.finance.v1');
          if (r) {
            var p = JSON.parse(r);
            var stored = p && p.settings && p.settings.theme;
            if (stored && validThemes.includes(stored)) t = stored;
          }
        }
        // Application default theme is Obsidian Lavender ('navy')
        if (!t) {
          t = 'navy';
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = (t === 'cream' || t === 'liquid') ? 'light' : 'dark';
        var metaColors = { cream: '#f4ecdc', cyan: '#0d1a1f', liquid: '#0b0b14', navy: '#0c0c13', midnight: '#10231e' };
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', metaColors[t] || '#0c0c13');
      } catch (e) {}
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
